<!DOCTYPE html>
<html>
<head>
  <title>Aletheia</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0f19;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
      width: 500px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #answer {
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Aletheia</h1>
    <p>Ask a question.</p>

    <input id="question" placeholder="Enter your question..." />
    <br>
    <button onclick="askAI()">Ask</button>

    <p id="answer"></p>
  </div>

<script>
async function askAI() {
  const question = document.getElementById("question").value;

  if (!question) return;

  document.getElementById("answer").innerText = "Thinking...";

  const res = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question })
  });

  const data = await res.json();
  document.getElementById("answer").innerText = data.answer;
}
</script>

</body>
</html>
